[project]
name = "asset-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "ag-ui-protocol>=1,<2",
  "langgraph>=1.2.16,<2",
  "langgraph-checkpoint-sqlite>=3.1.2,<4",
  "langchain-google-genai>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
